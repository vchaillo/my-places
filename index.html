<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>My Places — Mes lieux</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="./styles.css"></head><body><div id="app"><aside class="sidebar"><header><div class="brand">◈ <strong>My Places</strong></div><p>Vos bonnes adresses, au même endroit.</p></header><nav><button class="tab active" data-view="map">🗺️ Carte</button><button class="tab" data-view="places">📍 Mes lieux</button><button class="tab" data-view="lists">📋 Mes listes</button></nav><div class="filters"><input id="search" placeholder="Rechercher un lieu…"><select id="categoryFilter"><option value="">Toutes les catégories</option></select><select id="statusFilter"><option value="">Tous les statuts</option><option value="todo">À découvrir</option><option value="done">Visité</option></select></div><div class="listhead"><strong id="listTitle">Mes adresses</strong><span id="count"></span></div><div id="placesList" class="places"></div><footer><button id="addPlace" class="primary">＋ Ajouter un lieu</button><small>Données conservées sur cet appareil · Firebase à venir</small></footer></aside><main><div id="map"></div><section id="panel" hidden></section></main></div><dialog id="editor"><form id="placeForm"><div class="dialoghead"><h2 id="formTitle">Ajouter un lieu</h2><button type="button" id="closeDialog" class="icon">✕</button></div><label>Nom *<input name="name" required maxlength="120" placeholder="Ex. Glacier préféré"></label><label>Adresse / ville<input name="address" placeholder="Paris, France"></label><div class="row"><label>Latitude *<input name="lat" type="number" step="any" required></label><label>Longitude *<input name="lng" type="number" step="any" required></label></div><button type="button" id="geocode">📍 Trouver les coordonnées depuis l'adresse</button><div class="row"><label>Catégorie<select name="category" id="formCategory"></select></label><label>Statut<select name="status"><option value="todo">À découvrir</option><option value="done">Visité</option></select></label></div><label>Notes<textarea name="notes" rows="3" placeholder="Une spécialité à goûter, un conseil…"></textarea></label><div class="actions"><button type="button" id="deletePlace" class="danger" hidden>Supprimer</button><button type="submit" class="primary">Enregistrer</button></div></form></dialog><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="./app.js"></script></body></html>
